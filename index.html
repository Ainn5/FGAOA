<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174c3c"><title>Fernhill Garden | Resident Services</title>
<style>
:root{--green:#174c3c;--green2:#236b51;--bg:#f3f7f4;--ink:#1c2923;--muted:#64736b;--line:#dce7df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:linear-gradient(125deg,#123c30,#287456);color:white;padding:28px 18px 34px;text-align:center}
.brand{font-size:12px;letter-spacing:.18em;font-weight:700;opacity:.85}.logo{font-size:34px;margin:8px 0 0}.subtitle{margin:3px 0 0;color:#e0eee6}
main{max-width:760px;margin:-16px auto 40px;padding:0 16px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 28px #173e2c0b}
h1,h2{margin:0 0 8px}h1{font-size:23px}h2{font-size:19px}.muted{color:var(--muted);font-size:14px;margin:0 0 18px}
label{display:block;font-weight:650;font-size:14px;margin:14px 0 6px}input,select{width:100%;padding:13px 14px;border:1px solid #cbd9cf;border-radius:10px;font:inherit;background:white;color:var(--ink)}input:focus,select:focus{outline:3px solid #d5eadc;border-color:var(--green2)}
button{border:0;border-radius:10px;background:var(--green);color:white;padding:13px 17px;font:inherit;font-weight:700;cursor:pointer}button:hover{background:var(--green2)}button:disabled{opacity:.5;cursor:not-allowed}.full{width:100%;margin-top:14px}.secondary{background:#e9f2ec;color:var(--green)}.hidden{display:none!important}
.notice{padding:12px 14px;background:#fff7e6;border:1px solid #f0dfb7;border-radius:10px;color:#71551c;font-size:13px;margin-top:14px}
.status{font-size:14px;margin-top:12px;min-height:22px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.userline{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.contact{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.contact strong{display:block}.contact small{color:var(--muted)}
.empty{text-align:center;padding:26px 12px;color:var(--muted);background:#f7faf8;border-radius:12px;margin-top:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 28px}
@media(max-width:480px){.panel{padding:18px}.contact{align-items:flex-start}}
</style>
</head>
<body>
<header><div class="brand">RESIDENT SERVICES DIRECTORY</div><div class="logo">FERNHILL GARDEN</div><p class="subtitle">Helpful contacts for our apartment community</p></header>
<main>
<section class="panel">
<h1>Service Contacts</h1><p class="muted">Choose a service category to view the available contact details.</p>
<label for="category">Select service category</label>
<select id="category" onchange="showContacts()"><option value="">Choose a category</option>
<option value="category-manager">Manager</option><option>Electrician</option><option>Plumber</option><option>Gardener</option><option>Security</option><option>Dhobi / Laundry</option><option>Library</option><option>Carpenter</option><option>Housekeeping</option><option>AC Technician</option><option>Lift Maintenance</option><option>Garbage Collection</option><option>Car Washing</option></select>
<div id="results" aria-live="polite"><div class="empty">Choose a category to view its contact details.</div></div>
</section>
</main>
<footer>Fernhill Garden Resident Services</footer>
<script>
function showContacts() {
  const selected = document.getElementById("category").value.trim().toLowerCase();
  const results = document.getElementById("results");
  const contacts = {
    "category-manager": [
      { name: "Manoj", phone: "99025 28024" }
    ],
    electrician: [
      { name: "Prasanna", phone: "9902254638" },
      { name: "Naveen", phone: "" }
    ],
    plumber: [
      { name: "Das", phone: "7760077054" }
    ],
    security: [
      { name: "MainGate", phone: "080 41237702" },
      { name: "Sribas", phone: "7676656986" }
    ]
  };
  results.replaceChildren();
  if (!selected) {
    results.innerHTML = '<div class="empty">Choose a category to view its contact details.</div>';
    return;
  }
  const list = contacts[selected] || [];
  if (!list.length) {
    results.innerHTML = '<div class="empty">No contact has been added for this category yet.</div>';
    return;
  }
  list.forEach(contact => {
    const card = document.createElement("div");
    card.className = "contact";
    const info = document.createElement("div");
    const name = document.createElement("strong");
    const phone = document.createElement("small");
    name.textContent = contact.name;
    phone.textContent = contact.phone || "Phone number not provided";
    info.append(name, phone);
    card.append(info);
    results.append(card);
  });
}
</script>
</body></html>
