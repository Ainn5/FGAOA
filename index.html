<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#174c3c"><title>Fernhill Garden | Resident Services</title>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;background:#f3f7f4;color:#1c2923;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;word-wrap:break-word;overflow-wrap:break-word}img,input,select,button{max-width:100%}
header{background:#174c3c;background:linear-gradient(125deg,#123c30,#287456);color:white;padding:28px 18px 34px;text-align:center}
.brand{font-size:12px;letter-spacing:.18em;font-weight:700;opacity:.85}.logo{font-size:34px;margin:8px 0 0}.subtitle{margin:3px 0 0;color:#e0eee6}
main{width:100%;max-width:760px;margin:-16px auto 40px;padding:0 16px}.panel{background:white;border:1px solid #dce7df;border-radius:18px;padding:22px;box-shadow:0 8px 28px #173e2c0b}
h1,h2{margin:0 0 8px}h1{font-size:23px}h2{font-size:19px}.muted{color:#64736b;font-size:14px;margin:0 0 18px}
label{display:block;font-weight:650;font-size:14px;margin:14px 0 6px}input,select{width:100%;min-width:0;-webkit-appearance:none;appearance:none;min-height:48px;padding:13px 14px;border:1px solid #cbd9cf;border-radius:10px;font:inherit;background:white;color:#1c2923}input:focus,select:focus{outline:3px solid #d5eadc;border-color:#236b51}
button{min-height:44px;-webkit-appearance:none;appearance:none;border:0;border-radius:10px;background:#174c3c;color:white;padding:13px 17px;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#236b51}button:disabled{opacity:.5;cursor:not-allowed}.full{width:100%;margin-top:14px}.secondary{background:#e9f2ec;color:#174c3c}.hidden{display:none!important}
.notice{padding:12px 14px;background:#fff7e6;border:1px solid #f0dfb7;border-radius:10px;color:#71551c;font-size:13px;margin-top:14px}
.status{font-size:14px;margin-top:12px;min-height:22px;color:var(--muted)}.toolbar{display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-pack:justify;-ms-flex-pack:justify;justify-content:space-between;-webkit-box-align:center;-ms-flex-align:center;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar>*{margin:4px}.userline{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.contact{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:12px;display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-align:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:justify;-ms-flex-pack:justify;justify-content:space-between;flex-wrap:wrap}.contact>div{min-width:0;overflow-wrap:anywhere}.contact strong{display:block}.contact small{color:var(--muted)}
.empty{text-align:center;padding:26px 12px;color:var(--muted);background:#f7faf8;border-radius:12px;margin-top:14px}
footer{width:100%;text-align:center;color:var(--muted);font-size:12px;padding:0 16px 28px}
@media(max-width:600px){header{padding:24px 14px 30px}.logo{font-size:28px}main{padding:0 12px}.panel{padding:18px}.contact{-webkit-box-align:start;-ms-flex-align:start;align-items:flex-start}.contact>*{max-width:100%}}@media(max-width:360px){.panel{padding:14px}h1{font-size:21px}.contact{padding:12px}}
@media (max-width:600px){input,select,button{font-size:16px}.contact{gap:8px}.toolbar{gap:6px}}
@media (hover:none){button{min-height:48px}}
</style>
</head>
<body>
<header><div class="brand">RESIDENT SERVICES DIRECTORY</div><div class="logo">FERNHILL GARDEN</div><p class="subtitle">Helpful contacts for our apartment community</p></header>
<main>
<section class="panel">
<h1>Service Contacts</h1><p class="muted">Choose a service to view the available contact details.</p>
<label for="category">Select service</label>
<select id="category" onchange="showContacts()"><option value="">Choose a service</option>
<option value="category-manager">Manager</option><option>Electrician</option><option>Plumber</option><option>Gardener</option><option>Security</option><option>Dhobi / Laundry</option><option>Library</option><option>NewsPaper</option><option>Carpenter</option><option>Housekeeping</option><option>AC Technician</option><option>Lift Maintenance</option><option>Garbage Collection</option><option>Car Washing</option></select>
<div id="results" aria-live="polite"><div class="empty">Choose a category to view its contact details.</div></div>
</section>
</main>
<footer>Fernhill Garden Resident Services</footer>
<script>
function showContacts() {
  var selected = document.getElementById("category").value.replace(/^\\s+|\\s+$/g, "").toLowerCase();
  var results = document.getElementById("results");
  var contacts = {
    "category-manager": [
      { name: "Manoj", phone: "99025 28024" }
    ],
    electrician: [
      { name: "Prasanna", phone: "9902254638" },
      { name: "Naveen", phone: "" }
    ],
    plumber: [
      { name: "Das", phone: "7760077054" }
    ],
    security: [
      { name: "MainGate", phone: "080 41237702" },
      { name: "Sribas", phone: "7676656986" }
    ],
    library: [
      { name: "Puttaraju", phone: "9538052318" }
    ],
    newspaper: [
      { name: "LakshmiNarayana", phone: "8105297102" }
    ],
    "car washing": [
      { name: "Raju", phone: "9686273845" },
      { name: "Munna", phone: "8904418790" },
      { name: "Snello Car Clean (Outside Fernhill)", phone: "9620763556", note: "WhatsApp chat only" }
    ]
  };
  while (results.firstChild) { results.removeChild(results.firstChild); }
  if (!selected) {
    results.innerHTML = '<div class="empty">Choose a category to view its contact details.</div>';
    return;
  }
  var list = contacts[selected] || [];
  if (!list.length) {
    results.innerHTML = '<div class="empty">No contact has been added for this category yet.</div>';
    return;
  }
  for (var i = 0; i < list.length; i++) {
    var contact = list[i];
    var card = document.createElement("div");
    card.className = "contact";
    var info = document.createElement("div");
    var name = document.createElement("strong");
    var phone = document.createElement("small");
    name.textContent = contact.name;
    phone.textContent = contact.phone || "Phone number not provided";
    info.appendChild(name);
    info.appendChild(phone);
    if (contact.note) {
      var note = document.createElement("small");
      note.textContent = contact.note;
      note.style.display = "block";
      info.appendChild(note);
    }
    card.appendChild(info);
    results.appendChild(card);
  }
}
</script>
</body></html>
